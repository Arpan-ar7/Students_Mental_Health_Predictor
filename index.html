<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindGuard - Mental Health Score Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>
    <div class="bg-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="particles" id="particles"></div>

    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-brain"></i>
            </div>
            <span class="logo-text">MindGuard</span>
        </div>
        <p class="subtitle">Analyze your digital habits and discover your mental wellness score. Our AI-powered predictor helps you understand the connection between screen time and mental health.</p>
    </header>

    <div class="container">
        <div class="form-card">
            <form id="predictForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label><i class="fas fa-calendar-alt"></i> Age</label>
                        <input type="number" name="Age" min="10" max="100" placeholder="Enter your age" required>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-venus-mars"></i> Gender</label>
                        <select name="Gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-globe"></i> Country</label>
                        <input type="text" name="Country" placeholder="e.g., India, USA, UK" required>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-graduation-cap"></i> Academic Level</label>
                        <select name="Academic_Level" required>
                            <option value="" disabled selected>Select Level</option>
                            <option value="High School">High School</option>
                            <option value="Undergraduate">Undergraduate</option>
                            <option value="Graduate">Graduate</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-mobile-alt"></i> Most Used Platform</label>
                        <select name="Most_Used_Platform" required>
                            <option value="" disabled selected>Select Platform</option>
                            <option value="Facebook">Facebook</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Twitter">Twitter</option>
                            <option value="TikTok">TikTok</option>
                            <option value="YouTube">YouTube</option>
                            <option value="Snapchat">Snapchat</option>
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="WeChat">WeChat</option>
                            <option value="LINE">LINE</option>
                            <option value="KakaoTalk">KakaoTalk</option>
                            <option value="VKontakte">VKontakte</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-bullseye"></i> Purpose of Use</label>
                        <select name="Purpose_Of_Use" required>
                            <option value="" disabled selected>Select Purpose</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                            <option value="Networking">Networking</option>
                            <option value="News">News</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-clock"></i> Daily Usage (hours)</label>
                        <div class="range-container">
                            <input type="range" name="Avg_Daily_Usage_Hours" min="0" max="24" step="0.5" value="3" id="usageRange">
                            <span class="range-value" id="usageValue">3</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-unlock"></i> Daily Unlocks</label>
                        <input type="number" name="Daily_Unlocks" min="0" placeholder="e.g., 45" required>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-book"></i> Study Hours</label>
                        <div class="range-container">
                            <input type="range" name="Study_Hours" min="0" max="24" step="0.5" value="2" id="studyRange">
                            <span class="range-value" id="studyValue">2</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-running"></i> Physical Activity (hours)</label>
                        <div class="range-container">
                            <input type="range" name="Physical_Activity_Hours" min="0" max="24" step="0.5" value="1" id="activityRange">
                            <span class="range-value" id="activityValue">1</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-bed"></i> Sleep per Night (hours)</label>
                        <div class="range-container">
                            <input type="range" name="Sleep_Hours_Per_Night" min="0" max="24" step="0.5" value="7" id="sleepRange">
                            <span class="range-value" id="sleepValue">7</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label><i class="fas fa-heartbeat"></i> Stress Level</label>
                        <select name="Stress_Level" required>
                            <option value="" disabled selected>Select Level</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Very High">Very High</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Analyze My Mental Health <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="result-card" id="resultCard">
                <div class="result-label">Your Mental Health Score</div>
                <div class="progress-ring">
                    <svg width="200" height="200">
                        <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
                        <circle class="progress-ring-fill" id="progressRing" cx="100" cy="100" r="90" stroke="url(#gradient)"/>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#6366f1"/>
                                <stop offset="100%" style="stop-color:#ec4899"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="progress-ring-text" id="scoreText">0</div>
                </div>
                <div class="result-message" id="resultMessage">Analyzing...</div>
                <div class="result-desc" id="resultDesc">Please wait while we process your data.</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
